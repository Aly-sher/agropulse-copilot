[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agropulse-copilot"
version = "1.0.0"
description = "Enterprise Hyper-Local Smallholder Crop & Irrigation Copilot"
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "qdrant-client>=1.11.0",
    "httpx>=0.25.0",
    "onnxruntime>=1.19.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "types-setuptools",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 108
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# Tell mypy the root of the python packages is the 'backend' folder
mypy_path = "backend"
# Strictly limit the files it scans
files = ["backend/app", "tests"]